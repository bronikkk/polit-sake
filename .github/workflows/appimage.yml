name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            imagemagick \
            file \
            sed \
            wget \
            desktop-file-utils

      - name: Build application
        run: |
          sed -i 's/DEFINES += USE_WEBENGINE//' polit-sake.pro
          qmake6 polit-sake.pro CONFIG+=release
          make -j"$(nproc)"
          test -x polit-sake

      - name: Download linuxdeploy
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O linuxdeploy-plugin-qt.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          install -m 755 polit-sake AppDir/usr/bin/polit-sake

          convert pics/favicon.ico[0] -resize 256x256 \
            AppDir/usr/share/icons/hicolor/256x256/apps/polit-sake.png

          cat > AppDir/usr/share/applications/polit-sake.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=polit-sake
          Comment=Manage lists of political prisoners
          Exec=polit-sake
          Icon=polit-sake
          Categories=Utility;
          Terminal=false
          EOF

          cp AppDir/usr/share/applications/polit-sake.desktop AppDir/polit-sake.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/polit-sake.png AppDir/polit-sake.png

      - name: Bundle Qt and generate AppImage
        env:
          QMAKE: /usr/bin/qmake6
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: polit-sake-AppImage
          path: "*.AppImage"
          if-no-files-found: error
